text: |-
  Født i 1950.\
  Uddannet på Det Kongelige Danske Kunstakademi i København.\
  Debuterede i 1983 på Kunstnernes Påskeudstilling.\
  Medlem af Billedkunstnernes Forbund BKF.\
  Fhv. medlem af lokal og central bestyrelse.\
  Medlem af Dansk Billedhuggersamfund

  Arbejder i tre spor: Frie arbejder, udsmykninger og portrætbuster.

  ## Udvalgte frie arbejder

  |  |  |
  |---|---|
  | 2005- 2019 | Mit hidtil største og mest omfattende frie arbejde er skulpturprojektet Perpetuum Mobile. Det er foreløbig blevet udstillet i installationsversion. Projektet involverer et samarbejde med en komponist og adskillige af Danmarks fremmeste tænkere i en fælles bestræbelse på at belyse og gentænke vores samfundsorden i et fremtidsscenarie. |
  | 2016 | Satellite, hængeskulptur, akryl. |
  | 2016 | Heads up! / installation, flere materialer. |
  | 2002-3 | LysStof, skulpturserie, epoxy, bestående af tre svævende dobbeltskulpturer og en enkelt. |
  | 1996 - 2000 |  |
  | 1993-94 | Banebørster, bronze. |
  | 1992-93 | Det Bærende Element, møtrikker. |
  | 1990-93 | Fuglekvinde, kobber. |
  | 1990 | Kentaur, zink og kobber. |
  | 1984-87 | Myter om Primitivitet. To legemsstore skulpturgrupper, polykrom gips. |

  ## Udvalgte udsmykninger:

  |  |  |
  |---|---|
  | 2014 | Udsmykning uden titel, bronze, opstillet på kontorhotel i København, bestilt af Brink Serviced Offices. |
  | 2012 | Legende Barn, bronze. Skoleudsmykning. Bestilt af Fluxus ApS. Opstillet på Torstedskolen, Horsens. |
  | 2012 | På Kanten, dobbeltskulptur, bronze. Opstillet på Mathilde Fibigers Plads, Århus. Købt af Århus kommune 2001. |
  | 2003 | Fuglekvinde, kobber. Købt af HK/Danmark. Opstillet i HK's domicil i København. |
  | 2001 | Satori, bronze, polykarbonat, fiberlys. Bestilt af Århus Amt. Opstillet på Skanderborg VUC. |
  | 1999 | Enhjørning, bronze. Bestilt af og opstillet på Stenomuseet, Århus. |
  | 1993-94 | Banebørster, bronze. Bestilt af Hadsten Kommune og DSB. Opstillet på Hadsten Station. |
  | 1992-93 | Det Bærende Element, møtrikker. Bestilt af, og opstillet på AMU-Center Århus, Hasselager. |
  | 1988-89 | Vokseværk, bronze.Bestilt af Århus Kommune. Opstillet i Musikhushaven, Århus. |
  | 1984-87 | Myter om Primitivitet. To legemsstore skulpturgrupper, polykrom gips. Bestilt af Moesgård Museum. Tilhører Moesgård Museum. |

  ## Udvalgte officielle portrætter

  |  |  |
  |---|---|
  | 2025 | Portrætbuste af Professor emerita, dr.jur. Eva Smith, bronze. Opstillet på Juridisk Fakultet, Københavns Universitet. Finansieret af Kirsten og Niels Reisby Fonden |
  | 2020 | Portrætbuste, bronze, af forfatter Karin Michaëlis. Bestilt af Karin Michaëlis Selskabet, opstillet i Randers. |
  | 2013 | Portrætbuste, bronze, af H.K.H. Kronprinsesse Mary. Bestilt af Rømerfondet og doneret til ARoS Kunstmuseum. |
  | 2010 | Portrætbuste, bronze, af Kaj Birksted. Bestilt af Kaj Birksted komiteen. Opstillet i Churchillparken, København. |
  | 2004 | Portrætbuste, bronze, af fhv. landsstyreformand Jonathan Motzfeldt. Opstillet i Nuuk, Grønland i anledning af 25-årsdagen for Grønlands Hjemmestyre. |
  | 1998 | Portrætbuste, bronze, af Hendes Majestæt Dronning Margrethe II. Finansieret af CAC-Fonden. Opstillet på Århus Kunstmuseum ARoS. |
  | 1995 | Portrætbuste, bronze, af fhv. statsminister Poul Schlüter. Købt af Den Berlingske Fond. Opstillet i Tønder og i Folketinget. |
  | 1995 | Portrætbuste, bronze, af dav. borgmester i Århus, Thorkild Simonsen. Købt af Rømerfonden. Opstillet i Århus Musikhus. |

  ## Repræsenteret på

  - ARoS, Aarhus Kunstmuseum
  - Frederiksborg Museum

  ## Udvalgte udstillinger

  |  |  |
  |---|---|
  | 2024 | Prisudstilling, Den Frie Udstillingsbygning |
  | 2020 | Pop-up Mixes, Aarhus |
  | 2019 | Installation Perpetuum Mobile - Pop-up udstillingsstedet Kalkværksvej 5B Aarhus |
  | 2019 | Klimakunst - Thingbæk Kalkminer |
  | 2018 | Skulpturbiennale Dronninglund Kunstcenter |
  | 2017 | Floating Art, Vejle Kunstmuseum |
  | 2016 | Kunstcenter Silkeborg Bad |
  | 2011 | Frederiksborgmuseet |
  | 2010 | Plein-Air-Udstilling i Park Burg Schaubeck, Tyskland |
  | 2008 | Plein-Air-Udstilling i Park Burg Schaubeck, Tyskland |
  | 2008 | Artbreit, Tyskland |
  | 2007-8 | Nordisk vandreudstilling: Frederiksborgmuseet, Island, Finland, Norge og Sverige |
  | 2006 | Skulpturtriennale Bad Ragartz, Schweiz |
  | 2005 | Kunstmesse Süssen, Tyskland |
  | 2004 | Charlottenborg / PRO |
  | 2004 | Artbreit, Tyskland |
  | 2003 | Udstillingsbygningen Kapellet, København |
  | 2002 | "Kunstwege in Süssen", Tyskland |
  | 2001 | Århus Kunstmuseum |
  | 2000 | Århus Kunstbygning |
  | 1999 | Kvindemuseet i Danmark |
  | 1998 | Kunstmesse, Århus |
  | 1995 | Vejle Amtsgård |
  | 1994 | GALLERI 11 DR/TV: 14.04.1994 \* 20.12.1994 |
  | 1993 | CPH Lufthavn, Udenrigsafgangen |
  | 1990 | Ridehuset, Århus /LABYRINT |
  | 1987 | Moesgård Museum |
  | 1983 | Århus Kunstbygning |

  ## Fonde og legater / priser

  Anne Marie og Carl Nielsens hæderspris 2024\
  Knud Højgaards Fond\
  Konsul Jorck og hustrus Fond\
  Toyota Fonden\
  Købmand Herman Sallings Fond\
  Henry Heerups Legat/pris\
  Kunstrådet, Billedkunstudvalget\
  Billedhugger, professor Gottfred Eichoff og hustrusLegat.\
  Århus Kommunes Kunstnerstipendium\
  Århus Kommunes Kulturudviklingspulje\
  Åge & Ulla Filtenborgs Fond\
  Anna E. Munchs Legat\
  Gerhard Hennings Fond\
  KAD & SID's Kulturfond

  ## Netværk

  Har gennem 30 år haft glæde af netværket i kunstnerkolonien Spanien.\
  Samarbejder med bronzestøberi og galleri Strassacker, Tyskland\
  Har samarbejdet med:\
  Dansk Hydraulisk Institut\
  Teknologisk Institut, Aarhus\
  Moesgaard Museum\
  Statens Værksteder f. Kunst\
  Aarhus Billedkunst Center\
  Komponist Simon Steen-Andersen\
  Konsulent: Ingeniørfirmaet Øllgaard\
  Konsulent: Arkitektfirmaet Friis & Molkte / design\
  Udviklings samarbejde med lektor Niels Martin Larsen, Aarhus Arkitektskole\
  Udviklings samarbejde med idustriel designer Stephan Astrup, SanDesign\
  Lyskunst samarbejde med Lars Stenholt Kirkegaard / Fotografit - underwater imaging and light.

  ## Links

  YouTube: [DeProfundis Og LightMatter separatudstilling i Kapellet, København](https://www.youtube.com/watch?v=zAUfZ4Q3jLw)\
  YouTube: [Perpetuum Mobile – Talks on Migration](https://www.youtube.com/channel/UC3zBduK_ZGZ-qQUO6fdnDpw)

  [PDF-udgave](/files/cvg_dansk.pdf)
