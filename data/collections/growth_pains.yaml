short_name: "growth_pains"
name: "Vokseværk"
weight: 100
sections:
  - "commissions"
text: |-
  Museumsinspektør mag.art. Birgit Hessellund skriver om Vokseværk, der er opstillet i Musikhushaven i Århus:

  Århus' samling af udendørs skulpturer bliver i august 1989 forøget med bronceskulpturen VOKSEVÆRK, skabt af Gudrun Steen-Andersen. Med sin fine placering ved bassinet foran Musikhuset vil han komme til at hilse på rigtigt mange besøgende, både lokale og turister. Og ingen vil have nødig at diskutere hvad skulpturen nu også forestiller. For det kan enhver se!

  Men hvem tænker på, at det i virkeligheden er temmeligt dristigt at arbejde så naturalistisk anno 1989? For det er jo slet ikke moderne! Det kræver ret beset samme mod og sejhed som modernisten, da han for 100 år siden skulle sætte sig ud over kravet om naturtro gengivelse af den ydre virkelighed. "Naturen er intet, billedet af den er alt", gjaldede modernismens kampråb. Og vist så. Men uden natur intet billede. Og uden mennesket ingen kunst.

  Fra tidernes morgen har mennesket været optaget af sin egen art. Kaster man et blik tilbage over kulturhistorien, får man vidnesbyrd om denne evige fascination og udforskning af den menneskelige krop og sjæl. Og selv det guddommelige blev vel først rigtig interessant, da det antog menneskelig skikkelse og blev kød og blod.

  Gudrun Steen-Andersen's dengang 12-årige søn har nok tjent som model. Men skulpturen er ikke et portræt af ham, den rækker videre og symboliserer selve begrebet VOKSEVÆRK, der rummer uro og forandring fra ét stade til et andet. Intet udtrykker som puberteten denne tilstand af både selvbevidst sikkerhed og uendelig sårbarhed, når puppehylstret begynder at revne, og metamorfosen fra barn til voksen skal til at finde sted. At mange kunstnere i tidens løb har følt sig tiltrukket af dette spændingsfelt kan ikke undre. Det er ofte set symboliseret i ungdommens forår kontra alderdommens efterår.

  Et af de mest kendte billeder er vel Edvard Munch's "Pubertet", som viser en ung, spinkel pige siddende på sin seng, med armene krydset beskyttende over kroppens nøgenhed.

  Gudrun Steen-Andersen's drengeskulptur gør sig derimod bred. Fødderne er plantet i solid bredstilling, hænderne sat i siden. Bare kom an, siger han til verden, denne knægt i lømmelalderen, som både er lidt fræk og fandenivoldsk.

  Sådan ser det ud ved første øjekast. Men udtrykket er flertydigt, for selvsikkerheden er et nødvendigt dække over alderens sårbarhed og hudløse følsomhed. Den har kunstneren indfanget i fint sete, små detaljer. I det skrå blik, der er lidt indadvendt og eftertænksomt - for det store spørgsmål hører også alderen til. I fødderne, der vipper ganske let over på forfoden. Han står og tager bestik af situationen og er klar til at bevæge sig fremad.
de:
  name: "Wachstumsschmerzen"
  text: |-
    Museumsleiterin Dr. Phil. Birgit Hessellund schreibt über die Skulptur "Wachstumsschmerzen", die ihren Standort im Musikhausgarten in Aarhus hat:\
    Die Aarhuser Freilichtskulpturensammlung wird August 1989 um die Bronzeskulptur "Wachstumsschmerzen" reicher, geschaffen von Bildhauerin Gudrun Steen-Andersen. Von ihrem feinen Standort am Bassin vor dem Musikhaus wird die Skulptur viele Besucher begrüßen - sowohl Einheimische als auch Touristen. Und keiner wird im Zweifel sein, was die Skulptur nun auch darstellt. Weil das ist für jeden ersichtlich! Wer denkt aber daran, daß es in der Tat ziemlich dreist ist, Anno 1989 so naturalistisch zu arbeiten? Denn es ist ja gar nicht modern! Es erfordert genau gesehen denselben Mut wie der des Modernisten, als er sich vor 100 Jahren über die naturgetreue Wiedergabe der äußeren Wirklichkeit hinwegsetzte. "Die Natur ist nichts, das Bild davon ist alles" hallte damals das Kampfgeschrei des Modernismus. Gewiß, aber ohne Natur kein Bild. Und ohne Menschen keine Kunst.

    Seit je her beschäftigt sich der Mensch mit seiner eigenen Gattung. Blickt man zurück auf die Kulturgeschichte, bekommt man Zeugnisse dieser ewigen Faszination und Erforschung des menschlichen Körpers und der menschlichen Seele. Selbst das Göttliche wurde wohl erst richtig interessant, als es menschliche Gestalt annahm und Fleisch und Blut wurde.

    Der damals 12-jährige Sohn von Gudrun Steen-Andersen hat ihr als Modell für die Skulptur gedient. Die Skulptur ist aber kein Portrait von ihm. Sie reicht weiter und symbolisiert Wachstumsschmerzen und die diesem Begriff innewohnende Unruhe und Veränderung von einer Stufe zu einer anderen.\
    Nichts drückt wie die Pubertät diesen Zustand von sowohl selbstbewußter Sicherheit als auch unendlicher Verwundbarkeit aus, wenn die Puppenhülle aufzubrechen beginnt und die Metamorphose vom Kind zum Erwachsenen stattfinden soll. Daß sich viele Künstler im Laufe der Zeit von diesem Spannungsfeld angezogen fühlten ist nicht verwunderlich. Oft wurde dies durch den Frühling der Jugend contra den Herbst des Alters symbolisiert.

    Eines der bekanntesten Gemälde ist Wohl "Pubertät" von Edvard Munch, das ein junges, zartes Mädchen auf seinem Bett sitzend, die Arme beschützend über die Nacktheit des Körpers verschränkt, darstellt.

    Die Jungenskulptur von Gudrun Steen-Andersen dagegen macht sich breit. Die Füße in breiter Grätschstellung und die Hände in die Seiten gestemmt. "Komm bloß an", sagt er der Welt, dieser Bursche in den Flegeljahren, der sowohl ein wenig frech als auch tollkühn ist.\
    So erscheint es auf den ersten Blick. Der Ausdruck ist aber mehrdeutig, denn die Selbstsicherheit ist ein notwendiger Deckmantel für die Verwundbarkeit des Alters und die unter die Haut gehende Empfindlichkeit. Dies hat die Künstlerin in gut gesehenen, kleinen Details eingefangen. Im schrägen Blick, der ein bißchen nach innen gekehrt und nachdenklich ist - weil die große Frage auch zum Alter gehört. In den Füßen, die ganz leicht nach vorn auf die Vorderfüße kippen. Er steht und schätzt die Lage ab und ist bereit, sich vorwärts zu bewegen.
en:
  name: "Growing Pains"
  text: |-
    Museum inspector, Birgit Hessellund, MA writes about Growing Pains, exhibited in The Concert Hall Aarhus Garden:\
    \
    In August 1989, Aarhus' collection of outdoor sculptures is being increased with the bronze sculpture GROWING PAINS, created by Gudrun Steen-Andersen. With its fine location by the basin in front of The Concert Hall, he will greet many visitors, both locals and tourists. And nobody will need to discuss what the sculpture is supposed to represent. Because everybody can see!

    But who considers how daring it is to work so naturalistically in the year 1989? It's not fashionable at all! All things considered, it requires the same courage and tenacity as the modernist, when he had to disregard the demand for realistic representation of the outward reality 100 years ago. "Nature is nothing, the image of it is everything" was slogan of the modernists. No doubt. But without nature, no image. And without people, no art.

    From the dawn of time, humans have been preoccupied by their own species. If you throw a glance back over cultural history, you will find evidence of this perpetual fascination and exploration of the human body and soul. And even the divine was only really interesting once it assumed a human shape and became flesh and blood.

    Gudrun Steen-Andersen's then 12-year-old son was probably the model. But the sculpture is not a portrait of him, it reaches further and symbolises the very term GROWING PAINS, which holds restlessness and change from one level to another. Nothing can express like puberty this condition of both self-consciousness and infinite vulnerability, when the cocoon starts to crack and the metamorphosis from child to adult is about to take place. That over time many artists have been drawn to this theme can not surprise. It is often seen symbolised in the spring of youth versus the autumn of old age. One of the most famous pictures must be Edward Munch's "Puberty" which shows a young, skinny girl sitting on a bed with her arms crossed protectively over the nudity of the body.

    Gudrun Steen-Andersen's boy, on the other hand, makes himself wide. The feet are solidly planted widely apart, his hands at his sides. Come on, he says to the world, this boy at the awkward age, who is both a bit cheeky and nonchalant.\
    That's how it looks at the first glance. But the expression is ambiguous, because the self-confidence is a necessary cover for the vulnerability and raw sensitivity of the age. The artist has captured this in finely perceived little details. In the slanted glance, which is slightly inward looking and pensive - because the big questions are also part of that age. In the feet, that tilt slightly over the front of the foot. He is sizing up the situation and is ready to move forward.
