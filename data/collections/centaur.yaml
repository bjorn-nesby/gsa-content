short_name: "centaur"
name: "Kentaur"
weight: 30
sections:
  - "free_works"
text: |-
  Privat deponeret

  Denne skulptur blev til i anledning af kunstnergruppen Labyrints jubilæumsudstilling i 1989 i Ridehuset, Århus, med temaet "Heste".

  Fra kataloget:

  "Blandingen af menneske og dyr fascinerer mig - at nærme mig dyret, som er mig fremmed, ved brug af menneskelige træk - og nå ind til dyret i mennesket. Hesten oplever jeg ikke som det dresserede redskab til arbejde og leg, men som en urkraft, en overlegen styrke - vild og uberegnelig.

  Det er nærliggende at tage afsæt i de mytiske væsner, som hesten gennem tiden har lagt krop til - og mest oplagt er kentauren, fordi den besidder den voldsomhed og styrke, jeg forbinder med hesten.

  Den klassiske afbildning af kentaurmyten har altid generet mig, fordi den består af to halve væsner. Jeg forstiller mig derimod en glidende overgang fra hest til menneske - men hvor holder hesten op, og hvor begynder mennesket? Jeg har valgt at holde fast ved hesten som grundform og igennem holdningen og udtrykket at nærme mig det menneskelige".
de:
  text: |-
    Ausgeliehen an Private

    Diese Skulptur ist anlässlich der Jubiläumsausstellung "Pferde" der\
    Künstlergruppe Labyrint 1989 in der Reithalle in Aarhus entstanden.

    Auszug aus dem Katalog:\
    "Die Mischung von Mensch und Tier fasziniert mich; mich dem Tier, das mir fremd ist, zu nähern, indem ich menschliche Züge verwende und an dem Tier im Menschen anzulangen.

    Das Pferd fasse ich nicht als das abgerichtete Werkzeug fürs Arbeiten und Spielen auf, sondern als eine Urkraft. Eine überlegene Kraft - wild und unberechenbar.

    Es war naheliegend, Ausgangspunkt in den mytischen Wesen, die das Pferd in der Geschichte verkörpert hat, zu nehmen. Mein Entschluss fiehl auf den Kentaur, da dieser (wohl wie kein anderer) die Gewaltigkeit und Stärke, die ich mit Pferden verbinde, besitzt.

    Die klassische Darstellung des Kentaurmythos hat mich immer gestört, weil sie aus zwei halben Wesen besteht. Ich dagegen stelle mich einen gleitenden Übergang von Pferd zu Menschen vor - aber wo hört das Pferd auf und wo fängt der Mensch an?

    Ich habe gewählt an der Grundform des Pferdes festzuhalten und mich durch die Haltung und den Ausdruck, dem Menschlichen zu nähern":
en:
  name: "Centaur"
  text: |-
    (Deposited in private collection)

    This sculpture was created for the artists' group Labyrint's anniversary exhibition with the theme "Horses" in 1989 at Ridehuset, Aarhus.\
    \
    From the catalogue:\
    "The amalgam of human and animal fascinates me - to get closer to the animal which is alien to me, through the use of human characteristics - and reach into the animal in the human being.\
    \
    I don't perceive the horse as a trained instrument for work and play, but as a primitive force, a superior strength - wild and unpredictable.\
    \
    I find it natural to take my influence from the mythical creatures, which the horse has inspired through time - and of these the centaur is the most obvious, because it possesses the force and strength I connect with the horse.\
    \
    The classical depiction of the centaur myth has always bothered me because it consists of two half creatures. I, on the other hand, picture a gradual transition from horse to human - but where does the horse end and where does the human begin?\
    I have chosen to maintain the horse as the basic form and convey the humanity through the expression and posture".\
    \
