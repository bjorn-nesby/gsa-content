short_name: "bird_woman"
name: "Fuglekvinde"
weight: 20
sections:
  - "free_works"
  - "commissions"
text: |-
  Placering: HK Domicil, København

  Denne skulptur bygger på den fælles-menneskelige drøm om at kunne flyve. Jeg har villet materialisere denne umulige længsel.

  Fuglekvinden er derfor et symbol for mig på den ultimative frihed - på godt og ondt.

  Vi har ønsket at erobre denne frihed så brændende, at vi har konstrueret magiske flyvende maskiner til at kompensere for vores manglende fysiske formåen.

  Men længslen sidder stadig i os.
de:
  name: "Vogelfrau"
  text: |-
    Plazierung HK Domicil, Kopenhagen.

    Diese Skulptur basiert auf dem gemeinmenschlichen Traum, fliegen zu können. Ich habe versucht, diese Sehnsucht nach dem Unmöglichen zu materialisieren. Die Vogelfrau ist für mich ein Symbol der ultimativen Freiheit - in guter und schlechter Hinsicht.

    Diese Freiheit zu erobern war ein so brennender Wunsch, daß wir magische fliegende Maschinen konstruiert haben als Kompensation unseres fehlenden fysischen Vermögen.

    Die Sehnsucht steckt in uns.
en:
  name: "Bird Woman"
  text: |-
    Placed at HK Domicil Copenhagen

    This sculpture is based on the collective human dream of being able to fly.I have sought to materialise this impossible yearning.

    Thus the Bird Woman is my symbol of ultimate freedom - for better or worse.

    We have desired to conquer this freedom so fervently, that we have constructed magical flying machines to compensate for our missing physical ability.

    But the longing is still in us.

    Exhibited at the Women's Museum in Denmark\
