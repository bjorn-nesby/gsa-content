short_name: "de_profundis"
name: "De Profundis"
weight: 10
sections:
  - "free_works"
text: |-
  > *"I og med at vi blev sproglige væsner …. blev vores individuelle livshistorie adskilt fra vores artsmæssige historie: Ikke én, men to fortællinger var på færde i menneskets krop og bevidsthed. Derfor kan et menneske ikke realisere sig selv fuldt ud uden også at søge denne splittelse overvundet. Hver eneste af os må i vores liv finde en måde at bringe de to tilsyneladende uafhængige fortællinger, som vores liv har kastet os ud i, sammen. Vi må kunne lytte til begge fortællingerne og forene dem i én meningsfuld historie, der kan sikre, at vi hører til både i det menneskelige fællesskab og i den levende verden, som er vores ophav...."\
  > En snegl på vejen */ Jesper Hoffmeyer

  Siden menneskets historie, i og med *at vi blev sproglige væsner*, spaltede sig i to linier, naturhistorien og kulturhistorien, har de disse fjernet sig stadig længere fra hinanden. Kulturlinien løsrev sig fra naturens overherredøme, og efterhånden blev herre-slave-forholdet vendt på hovedet. Magtovertagelsen blev endeligt beseglet med udviklingen af muligheden for i de inderste strukturer at forvandle natur til kultur - genteknologien.

  Et sted i rummet mellem de to linier findes nøglen til, hvem og hvad vi er idag. Her findes også nøglen til mange af vore myter og drømme som konkrete manifestationer af de uudsigelige eller undertrykte aspekter, der tilsammen udgør mennesket, men som vi ikke umiddelbart evner at se opløst i deres bestanddele.

  De Profundis kan ses som nedslag i dette rum - sindbilleder hentet fra hjørner, kanter og grænser i menneskets dobbelte dyb. De ni selvstændige skulpturer og skulpturgrupper er tænkt sammen og er aspekter af samme helhed - en cyklus. Denne er således ikke så meget fortællingen om et antal forskellige eksistenser, som det er fortællingen om én.

  Titlen De Profundis (Fra Dybet) er, især i musikalsk sammenhæng, stærkt forbundet med det religiøse afmagtsråb, som har befordret uendelig megen smuk og inderlig musik. (Fra Dybet råber jeg til dig , o Herre / Davids Salmer nr. 130).\
  Dette stærke billede på den eksistentielle afmagt har imidlertid også givet inspiration til denne skulpturcyklus, og jeg har valgt at låne Dybet herfra, omend det opleves fra en anden synsvinkel:\
  Tilblivelse, udvikling og udslettelse fra individ til art munder her ud i en hyldest til livet som en kaotisk, ekstatisk runddans, hvor de enkelte elementer afbalanceres af hinanden i den fælles bevægelses malstøm.\
  Det er øer af følelses- og tankegods i et miniatureunivers, hvis tilblivelse grunder sig i fascinationspunkter fra udviklingsbiologien over den sammenlignende adfærdsforskning til de genteknologiske aspekter i en stigende undren over fænomenet eksistens.

  De temaer, jeg forsøger at berøre, er magt / afmagt, det nye menneske / det uddøende menneske, altings leg med alting og tankens og fantasiens evne til at forestille sig det umulige og materialisere det.

  I den figurative abstraktion søger jeg intervallets fylde - rummet mellem det antydede og betragtningens spontane fuldbyrden.\
  Ligeledes bruger jeg det figurative som medie for abstrakt komposition. Både inden for de enkelte grupper som linier og energibaner - og overordnet som en bevægelse igennem hele cyklen mellem forskellige manifestationer af tre energitilstande: statisk, potentiel og kinetisk.

  Skulpturenes rå fremtoning kan tilskrives misforholdet mellem trangen til det monumentale udtryk og midlernes formåen. De står i det materiale, de er blevet skabt i, men denne sårbarhed kan måske være med til at formidle en større intimitet.

  Gudrun Steen-Andersen
de:
  text: |-
    > *Im Zuge der menschlichen Entwicklung zum Sprachwesen... hat sich der Weg, den unsere individuelle Lebensgeschichte einschlägt, vom Weg der Gattungsgeschichte getrennt. Nicht eine, sondern zwei Erzählungen verlaufen mitten durch den Körper und durch das Bewusstsein des Menschen. Daher kann der Mensch sich nicht vollständig verwirklichen, ohne dass er gleichzeitig versuchen würde, diese Spaltung zu überwinden. Jeder von uns muss in seinem Leben die Art und Weise ausfindig machen, wie er die beiden scheinbar voneinander unabhängigen Erzählungen wieder zusammenführen kann, in die unser Leben uns geworfen hat. Es geht darum, dass wir beiden Erzählungen zuhören und sie zu einer sinngebenden Erzählung vereinigen können. Einer Erzählung, die uns versichert, dass wir sowohl der menschlichen Gemeinschaft angehören als auch der Welt der Lebewesen, die unser Ursprung ist …\
    > Signs of meaning in the universe / Jesper Hoffmeyer*

    In der Evolution, im Zuge der menschlichen Entwicklung zum Sprachwesen, spaltete sich unsere Gattungsgeschichte in Naturgeschichte und Kulturgeschichte auf. Beide haben sich immer mehr von einander entfernt. Die Kultur befreite sich von der Herrschaft der Natur. Allmählich stellte sich das Verhältnis von Herr und Knecht auf den Kopf. Die Machtübernahme ist endgültig besiegelt, seit mit der Gentechnologie die Möglichkeit verfügbar geworden ist, Natur in ihren innersten Strukturen in Kultur zu verwandeln.

    Irgendwo im Raum zwischen den beiden Linien "Kultur" und "Natur" liegt der Schlüssel zur Klärung der Frage, wer und was wir heute sind. Hier liegt ebenfalls der Schlüssel zur Deutung vieler Mythen und Träume. Wir können sie als konkrete, anschauliche Manifestationen unaussprechlicher oder unterdrückter Aspekte des Menschseins erkennen. Zusammengenommen machen sie den Menschen aus, aber wir sind nicht imstande, sie unmittelbar in ihre Bestandteile aufgelöst zu betrachten.

    De Profundis kann als Sediment verstanden werden, das sich im Raum zwischen "Kultur" und "Natur" abgelagert hat: Sinnbilder, die empor geholt wurden aus der Tiefe des Menschen im doppelten Sinne, mit all ihren Ecken, Kanten und Grenzen. Die neun selbstständigen Skulpturen und Skulpturgruppen sind als Einheit konzipiert, als Aspekte jener Ganzheit - als Zyklus. Dieser erzählt dementsprechend nicht von einer Vielzahl unterschiedlicher Existenzen, sondern von der einen Existenz.

    Der Titel De Profundis ist eng mit dem religiösen Ruf der Ohnmacht verbunden. Wir verdanken ihm unendlich viel schöne, zutiefst ergreifende Musik. "Aus der Tiefe rufe ich zu dir, oh Herr", heißt es im 130. Psalm Davids. Dieses ausdrucksstarke Bild existenzieller Machtlosigkeit hat auch diesem Skulpturenzyklus als Inspiration gedient. Dem Bild aus dem religiösen und musikalischen Zusammenhang habe ich das Motiv der Tiefe entlehnt, die hier nun freilich aus einem anderen Gesichtspunkt erlebt wird. Der Weg des Individuums, das sich zur Art entwickelt, von seinem Entstehen über seine Entwicklung bis hin zu seiner Auslöschung, mündet in meinem Zyklus in eine Huldigung. Sie ist dem Leben gewidmet: einem chaotischen, ekstatischen Reigen, dessen Elemente sich in einem einzigen Mahlstrom miteinander ausbalancieren. Es sind Inseln von Gefühls- und Gedankengut; Inseln in einem Mikro-Universum, das entstanden ist aus Momenten der Faszination durch Biologie und Evolutionstheorie über vergleichende Verhaltensforschung bis hin zu Aspekten der Gentechnologie - entstanden aus meiner immerfort steigenden Verwunderung über das Phänomen der Existenz.

    Die Themen, die ich zu berühren versuche, sind Macht und Ohnmacht, der neue Mensch und der aussterbende Mensch, das Spiel von Allem mit Allem sowie die Kraft des Gedankens und der Phantasie, sich das Unmögliche vorzustellen und es zu materialisieren.

    In der figurativen Abstraktion suche ich nach der Fülle des Intervalls, nach dem Raum, der sich auftut zwischen der Andeutung und der spontanen Vollendung beim Betrachten.Ebenso verwende ich das Figurative als Medium der abstrakten Komposition. Das gilt sowohl innerhalb der einzelnen Gruppen in Linien und Energiefeldern, als auch im Sinne einer übergeordneten Dynamik, die durch den gesamten Zyklus hindurch läuft: einer Bewegung zwischen unterschiedlichen Manifestationen dreier Energiezustände, nämlich dem statischen, dem potenziellen und dem kinetischen.

    Die rohe Erscheinung der Skulpturen ist dem Missverhältnis zuzuschreiben, das zwischen monumentalem Ausdruck und dem begrenzten Vermögen der Mittel besteht. Die Skulpturen stehen da in dem Material, aus dem sie erschaffen sind. Aber vielleicht ist es gerade diese Verletzlichkeit, die eine stärkere Intimität zu vermitteln vermag.

    Gudrun Steen-Andersen\
    Übersetzung: Sabine S. Bech-Hansen
en:
  text: |-
    > *"In becoming articulate beings ...our individual life stories became divorced from our genetic history. Or, to put it another way: Not one but two stories are being enacted in the human body and consciousness.\
    > This makes it impossible for individuals to fully realize themselves without at the same time seeking to overcome this rift. Each and every one of us has to find some way in our lives of reconciling the two seemingly unrelated stories into which life has plunged us. We must be able to lend an ear to both narratives and unite them into one meaningful story - one which will ensure that we feel at home both in human society and in the living world from which we came"\
    > Signs of meaning in the universe */ Jesper Hoffmeyer

    Since the history of man, as *we became articulate beings*, separated into two distinct lines, the history of nature and of culture, these two lines have continued to diverge. The line of culture tore itself from the master rule of nature and eventually the master / slave relationship reversed. The takeover was finally solidified by the development of the ability to transform the innermost structures of nature to culture - the gene technology.

    The key to who and what we are today, lies somewhere in the gap between those two lines. Also to be found is the key to our many myths and dreams, as concrete manifestations of the unspeakable or suppressed aspects which together constitute man, and which we do not possess the ability to perceive split up into parts.

    De Profundis can be seen as impacts in this room - images of the mind gathered from the corners, edges and borders of the double deep of man. The nine independent sculptures and groups of sculptures are intended as a whole and are aspects of that same entity - a cycle. Thus it is not so much the tale of a number of different existences, as it is the tale of one.

    The title, De Profundis (From the Deep), is, in a musical context, closely related to the religious cry of despair, which has inspired a multitude of beautiful and intense music. (From the Deep I Thee call, oh Lord, Psalms of David, number 130 ).

    However, the powerful image of the existential despair has also given inspiration to this cycle of sculptures. And I chose to borrow The Deep from this, even if it is experienced from a different point of view:\
    Creation, evolution and extinction from the individual to the species - endning in homage to life as a chaotic, ecstatic round dance, where the individual elements are balances by the others by the maelstrom of collective motion. They are islands of emotional and intellectual goods in a miniature universe, whose origin is founded on points of fascination from evolutionism via comparative behavioral research to aspects of gene technology, in an ever increasing wonder about the phenomenon of existence.

    The themes I attempt to touch are: power / powerlessness, the new human/ the dying out human, everything's play everything, and the ability of thought and fantasy to imagine the impossible unfold and give it substance.

    In the figurative abstraction I seek the fullness of the interval - the span between the suggested and the spontaneous completion by the spectator.\
    Likewise I use the figurative as a medium for abstract composition. Within the individual groups as lines and paths of energy. And in a broader sense as a movement throughout the entire cycle between different manifestations of the three states of energy: static, potential and kinetic.

    The rough appearance of the sculptures is attributable to the disparity between the desire for monumental expression and the capacity of the means. They appear in the material in which they were created, but this vulnerability might convey more intimacy.

    Gudrun Steen-Andersen
