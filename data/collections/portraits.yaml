short_name: "portraits"
name: "Portrætter"
weight: 50
sections:
  - "portraits"
text: |-
  At portrætbusten indeholder en ekstra dimension i forhold til det malede portræt - ikke blot i ligefrem, men også i overført betydning - ligger for mig i det fantastiske faktum, at idet man arbejder fra alle sider, arbejder man med mange facetter samtidig og kan herved komme til at fange og fastholde flere udtryk i en helhed.

  Jeg kender virkemidlerne - ansigtets opbygning, udtrykkenes hentydninger og antydninger og ikke mindst deres oprindelse i muskulaturen. Men allerbedst som man arbejder, forvandler ansigtet sig til et landskab af konkave og konvekse former og konturer - og jeg forvandles til opdagelsesrejsende i dette landskab.

  Efterfølgende kan man være heldig at opdage - måske ved hjælp af nye belysninger og synsvinkler - noget, man har fastholdt helt uden brug af viljens vurderende, afvejende ræsonnementer. Men naturligvis spiller afvejningen af udtrykkenes samspil og modspil en stor rolle. For eksempel ligesom i farvernes verden at betjene sig af de komplementære udtryk, som tilsammen udgør en pulserende enhed, og som hver for sig fremhæves af deres modsætning.

  Et 3-dimensionelt portræt er således ikke en aftegning eller en efterligning og derfor ikke naturalistisk i mine øjne. Det er et konglomerat og et destillat af forskellige udtryk, der karakteriserer personligheden. De forskellige udtryk optræder sjældent på samme tid hos personen, men er til \
  stede i portrættet samtidig, og kan genopdages ved at se skulpturen i forskellige belysninger og fra forskellige vinkler. Alt dette ligger som en mulighed i det tredimensionale portræt.

  Jeg lægger vægt på portrætligheden - at give modellen, hvad modellens er. Mit personlige fingeraftryk ligger ikke i texturen eller i en bestemt manieret måde at gribe det an på, men i afvejningen af de udtryk, der tilsammen danner personlighedens ydre kendetegn.

  Når et menneske låner mig sit ansigt til frikiggeri, er det en gave. Således at stille sit ansigt til skue er efter min mening en utrolig tillidserklæring, som jeg modtager med stor respekt og varsomhed, for ikke bare øjnene, men hele ansigtet er jo personlighedens spejl, og ingen kan i længere tid ad gangen holde paraderne oppe - i hvert fald er det ikke meningen.

  I den periode, jeg arbejder på et portræt, rumsterer den portrætterede hele tiden i min bevidsthed i en blanding af empatisk forbundethed og fascination.. Det afføder et naturligt ønske om at yde modellen retfærdighed \
  ved at skildre vedkommende så nuanceret som muligt uden dog at fravige kravet om ærlighed.
de:
  name: "Portraits"
  text: |-
    Dass Portraitbüsten eine extra Dimension im Verhältnis zu gemalten Portraits haben - nicht nur in eigentlicher, sondern auch in übertragener Sinne - beruhen meiner Ansicht nach auf dem fantastischen Faktum, daß indem man von allen Seiten arbeitet, arbeitet man mit vielen Facetten gleichzeitig. Dies ermöglicht es, mehrere Ausdrücke in einer Ganzheit fangen und festhalten zu können.

    Ich kenne die Gestaltungsmittel - den Aufbau des Gesichtes, die Anspielungen und Andeutungen der Ausdrücke und nicht zuletzt ihren Ursprung in der Muskulatur. Während man arbeitet, verwandelt sich das Gesicht plötzlich in eine Landschaft konkaver und konvexer Formen und Konturen - und ich verwandle mich in eine Entdeckungsreisende in dieser Landschaft.\
    Später kann man das Glück haben - vielleicht mittels einer neuen Beleuchtung oder von einem neuen Blickwinkel - etwas zu entdecken, das man festgehalten hat, ganz ohne die abwägenden, beurteilenden Räsonnements seines Willens einzubezogen zu haben.\
    \
    Natürlicherweise spielt die Abwägung von dem Zusammenspiel und Gegenspiel der Ausdrücke auch eine große Rolle. Zum Beispiel bedient man sich - wie in der Welt der Farben - der komplementären Ausdrücke, die zusammen eine pulsierende Einheit bilden. Jeder Ausdruck für sich wird durch seinen Gegensatz verstärkt.

    Ein dreidimensionales Portrait ist demnach keine Abzeichnung oder Nachahmung und ist deshalb in meinen Augen nicht naturalistisch. Es ist ein Konglomerat und ein Destillat verschiedener Ausdrücke, die die Persönlichkeit bilden. Die verschiedenen Ausdrücke tauchen selten zur selben Zeit bei der Person auf, sind aber im Portrait zur gleichen Zeit ersichtlich. Beim Betrachten der Skulptur in verschiedenen Beleuchtungen und von verschiedenen Winkeln können diese wiederentdeckt werden.\
    All dies ist das Potential des dreidimensionalen Portraits.

    Ich messe der Portraitähnlichkeit Gewicht bei; dem Modell zu geben, was dem Modell gehört. Mein persönlicher Fingerabdruck liegt nicht in der Textur oder in einer bestimmt manirierten Arbeitsweise, sondern in der Abwägung der Ausdrücke, die gemeinsam die äusserlichen Kennzeichen der Persönlichkeit bilden.

    Wenn ein Mensch mir sein Gesicht gibt, ist es ein Geschenk. In dieser Weise sein Gesicht zur Schau zu stellen ist meiner Meinung nach ein unglaublicher Vertrauensbeweis, den ich mit großem Respekt und großer Behutsamkeit entgegennehme. Denn nicht nur die Augen, sondern das ganze Gesicht sind ja der Spiegel der Persönlichkeit, und letztendlich kann keiner während dieses längeren Arbeitsprozesses seine Persönlichkeit für sich behalten - das ist auf jeden Fall nicht die Absicht.

    In der Periode, in der ich an einem Portrait arbeite, rumort der Portraitierte die ganze Zeit in meinem Bewußtsein in einer Mischung aus empathischer Verbundenheit und Faszination. Dies führt einen natürlichen Wunsch herbei, dem Modell gerecht zu werden, indem ich es so nuanciert wie möglich darstelle, dabei aber noch ehrlich verbleibe.
en:
  name: "Portraits"
  text: |-
    Not just literally, but also metaphorically, the portrait bust contains an extra dimension compared to the painted portrait. This is a wonderful fact to me, because as you work from all sides, you work with many aspects at the same time and you can thus capture and hold more expressions in one whole.\
    I know the artistic effects - the structure of the face, the suggestions and allusions of the expressions and not least their origin in the musculature. But while you are working, the face turns into a landscape of concave and convex shapes and contours - and I turn into an explorer in this landscape.\
    Afterwards you can be lucky and discover - maybe with the aid of new lighting and points of view - something that you have captured quite without the use of the evaluative, appraisive reasoning of will.\
    But of course the appraisal of the interplay and interaction of the expressions plays a big role.\
    This can be compared to, for example, using the complimentary expressions in the world of colour, which together make up a pulsating unit and where each individually is enhanced by its opposite.\
    \
    This means that a three-dimensional portrait is not a delineation or a replica and thus, in my view, not naturalistic. It is a conglomerate and a distillation of various expressions, which characterise the personality. The different expressions are rarely present at the same time in the person, but are all manifested in the portrait and can be rediscovered by viewing the sculpture in different lights and from different angles.\
    All this is possible with the three-dimensional portrait.\
    \
    I stress the significance the portrait likeness - to give the model what the model is due.\
    My personal stamp is not in the texture or in a special mannered way of approaching things, but in the appraisal of the expressions which together make up the outer characteristics of personality.\
    \
    When a person lends me their face for free viewing, it is a gift. Putting your face on display like that is to me a great vote of confidence, which I receive with great respect and care. Not only the eyes, but the entire face is the mirror of the personality and no one can keep their guard up for longer periods of time. They are not supposed to anyway.\
    \
    In the period where I work on a portrait, the person being portrayed constantly figures in my subconscious with a mixture of empathic connection and fascination. This brings about a natural wish to do the model justice by portraying them as nuanced as possible while still being honest.
