short_name: "railway_hands"
name: "Banebørster"
weight: 80
sections:
  - "commissions"
  - "free_works"
text: |-
  Bestilt af DSB og Hadsten kommune\
  Opstillet på Hadsten station

  Fra projektbeskrivelsen:

  Skulpturen skildrer to arbejdende banebørster. To, fordi det er den mindste flerhed.Flerhed, fordi begrebet banebørster omfatter gruppen, sjakket.

  Min opgave har været, i skulpturel form - d.v.s. indeholdende de skulpturelle elementer, der bærer ud over den blotte beskrivelse - at formidle en oplevelse af banebørster, som jeg har tilegnet mig ved at studere de tilgængelige kilder: Egnsarkiver og -museer, Dansk Folkemindesamling, Arbejdermuseets arkiv, Nationalmuseets 3. afd.. Herudover har jeg haft glæde af at tale med personer med specialviden på området, samt studere enkelte bøger og en film om emnet.

  Denne oplevelse er det min opgave at formidle så facetteret som muligt. Ud fra hensynet til det skulpturelle har jeg valgt en arbejdssituation, hvor skulpturens 2 elementer forholder sig til det samme centrum. At forene i kompositionen deres modsætningsfyldte liv - styrke - råhed - sammenhold - afsavn - arbejdsglæde - og had.... ved at lade de 2 figurer repræsentere modsætningerne og lade deres indbyrdes forhold forene disse. Og på en sådan måde, at styrke, spænd, tyngde er dominerende udtryk, og at niveauforskellen mellem den figur, der står på skinne/svelleplateauet og den figur, der står i samme niveau som beskueren, bygger bro mellem fortidig og nutidig skulpturopfattelse. I valget af arbejdssituation ligger også hensynet til det utvetydige, idet de attributter, som stadfæster dem som banebørster, indgår som en del af kompositionen.

  Et monument over løsarbejderne, det hårde slids mænd, de utilpassede, dem med den store frihedstrang, særlingene. For mig står banebørsterne mest af alt for det.
de:
  name: "Rauhe Bahnburschen"
  text: |-
    Bestellt von der DSB (den Dänischen Staatsbahnen) und der Kommunalbehörde von Hadsten.\
    Aufgestellt auf dem Bahnhof von Hadsten, Dänemark.

    Auszug aus der Projektbeschreibung:\
    Die Skulptur schildert zwei arbeitende rauhe Bahnburschen.\
    Zwei, weil es die kleinste Mehrheit ist.\
    Mehrheit, weil der Begriff rauhe Bahnburschen die Gruppe, die Mannschafft, umfasst.

    Meine Aufgabe bestand darin, in skulptureller form, d.h. anhand von skulpturellen Elementen, fernab der bloßen Beschreibung, ein Erlebnis von rauhen Bahnburschen zu vermitteln. Ein Erlebnis, das ich bei der Recherche der verfügbaren Quellen hatte. Ich habe Regionale Archive, das volkskundliche Archiv, das Archiv des Arbeitermuseums studiert und Museen (zB. die dritte Abteilung des Nationalmuseums) besucht. Ferner hatte ich Nutzen von und Freude an der Unterhaltung mit Personen, die ein Fachwissen auf dem Gebiet besitzen sowie an dem Studium einzelner Bücher und eines Films über das Thema.

    Dieses Erlebnis so facettiert wie möglich zu vermittlen, hatte ich zur Aufgabe. Aus Rücksicht auf das Skulpturelle habe ich eine Arbeitssituation gewählt, in der sich die zwei Elemente der Skulptur zu demselben Zentrum verhalten. Ich habe versucht, ihr widersprüchliches Leben (Kraft - Rohheit - Zusammenhalt - Entbeerung - Arbeitsfreude- und Haß) in der Komposition zu vereinen, indem die beiden Figuren die Gegensätze repräsentieren und ihre gegenseitige Beziehung diese doch vereinen.

    Und in solch einer Weise, daß Kraft, Spannung und Wucht dominierende Ausdrücke sind und daß der Niveauunterschied zwischen der Figur, die auf dem Schienen/-Schwellenplateau steht und der Figur, die auf dem selben Niveau wie dem des Betrachters steht, Brücke zwischen früherer und gegenwärtiger Skulpturauffassung schlägt.

    Durch die Wahl ihrer Arbeitssituation, nehme ich auch Rücksicht auf das Unzweideutige, da die Attribute, die sie eben als rauhe Bahnburschen definieren, in die Komposition einbezogen sind. Ein Monument von den Gelegenheitsarbeitern, den Männern der schweren Arbeit, den Unangepassten, denjenigen mit dem großen Freiheitsdrang, den Sonderlingen.\
    Dafür stehen für mich die rauhen Bahnburschen.
en:
  name: "Railway Hands"
  text: |-
    Commissioned by Danish State Railways and the County of Hadsten\
    Exhibited at Hadsten Station

    From the Project Profile:\
    The sculpture portrays two working railway hands.\
    Two because it is the smallest unity.\
    Unity because the concept of railway hands includes the group, the team.

    My commission has been, in sculptural form – that is to say, containing the sculptural elements that carry beyond mere description – to convey an experience of the railway hands. I have acquired this understanding through studying the available sources: Regional Archives and Museums, The Danish Folklore Collection, the archives of the Workers’ Museum and The National Museum. I have also had the benefit of speaking to people with specialised knowledge of the area, as well as a studying few books and a film on the subject.

    It is my role to convey this experience as diversely as possible.\
    Out of consideration for the sculptural element, I have chosen a work situation where the two elements of the sculpture relate to the same centre. To unite the contradictions of their lives in the composition: Strength, roughness, solidarity, privation, the joy of work - and hatred… The two figures represent the contradictions and their relationship to each other unite these elements. And in such a way that strength, tension and gravity are dominating expressions, and that the differences in level between the figure standing on the rail level and the figure, which is at the same height as the viewer, bridge previous and contemporary conceptions of sculpture.\
    In the choice of the work situation there is also, however, consideration of the unambiguous, as the attributes, which give them their identity as railway hands, is part of the composition.

    A monument to the casual labourers, the men of drudgery, the maladjusted, the freedom seekers, the weirdos.\
    To me this is what the railway hands represent most of all.\
