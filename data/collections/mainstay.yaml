text: |-
  Det Bærende Element\
  *menneskesøjle*\
  Bestilt af og opstillet på AMU-Center Midtjylland\

  Uddrag af indvielsestale:\
  Nogen vil sikkert undre sig over, hvad en nøgen mand bestiller i foyeren til et uddannelsescenter for specialarbejdere. Det er såmænd enkelt nok: Det handler om uddannelse i beherskelse af redskaber.

  Og menneskets beherskelse af redskabet er jo netop det bærende element og forudsætningen for al udvikling. Sådan opstod ideen. Manden er symbolet menneske og møtrikken er symbolet redskab. I denne skulptur indgår mennesket og redskabet den tættest mulige forbindelse: redskabet er indskrevet i menneskeformen eller blevet menneskets beskyttende hud, om man vil. Gennem søjlemenneskets stilling, som på en gang er let og utvungen og søjleagtig stram, prøver jeg at give udtryk for den holdning, at naturligvis skal der kraft til at være det bærende element, men den kraft er allerede til stede i og med beherskelsen af redskabet.

  I min udtryksmåde stræber jeg efter at opnå en ydre og indre rumlighed og en lethed i skulpturen ved at arbejde med en gennembrudt overflade i den hule kontur.
de:
  name: "Das tragende Element"
  text: |-
    Das tragende Element* Menschensäule*

    Bestellt von und aufgestellt im AMU-Center Midtjylland (Ausbildungsstätte\
    für angelernte Arbeiter in Jütland, Dänemark)

    Auszug der Einweihungsrede:\
    Manche wundern sich sicherlich darüber, was ein nackter Mann im Foyer eines Ausbildungszentrums für angelernte Arbeiter macht. Die Antwort liegt nahe: Es geht um die Ausbildung zur Beherrschung von Werkzeugen.

    Und die Beherrschung von Werkzeugen in Menschenhand ist ja das tragende Element und die Voraussetzung jeglicher Entwicklung.So entstand auch die Idee. Der Mann ist das Symbol des Menschen, die Mutter das Symbol des Werkzeuges. In dieser Skulptur gehen der Mensch und das Werkzeug die dichtest mögliche Verbindung ein: Das Werkzeug ist der Menschenform eingeschrieben, ist, wenn man so sagen kann, die schützende Haut des Menschen geworden.

    Durch die Stellung der Menschensäule, die gleichzeitig leicht und ungezwungen und doch monumental ist, verleihe ich ihr den Ausdruck, dass es Kraft verlangt, tragendes Element zu sein. Diese Kraft ist aber schon vorhanden in und mit der Beherrschung des Werkzeuges. In meiner Ausdrucksweise strebe ich nach einer innerlichen und äusserlichen Räumlichkeit sowie nach einer Leichtigkeit in der Skulptur, indem\
    ich mit einer durchbrochenen Oberfläche in der hohlen Kontur arbeite.
en:
  name: "Mainstay/Caryatid"
  text: |-
    Mainstay/Carytid\
    *Human Column\
    *\
    Commissioned by and placed at the\
    AMU-Centre Aarhus\
    \
    Excerpt from the inauguration speech:\
    Some people will probably wonder what a naked man is doing in the foyer of an education centre for specialist workers.\
    It's really quite simple: It is about education in the mastery of tools.\
    And man's mastery of the tool is the mainstay and the precondition for all development.\
    This is my idea: The man is the symbol of human beings and the nut the symbol of tools. In this sculpture the human being and the tool enter into the closest possible union: The tool has been inscribed in the human form or has become the protective skin of a human being, if you like.\
    Through the posture of the column-human which is at the same time easy and comfortable, and tightly column-like, I try to convey the feeling that naturally power is required to be part of the sustaining element, but power is already present through mastery of the tool. Through this form of expression, I strive to achieve an outer and inner sense of spatiality and lightness in the sculpture, by working with a penetrated surface in the hollow contour.
