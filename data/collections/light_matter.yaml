short_name: "light_matter"
name: "LysStof"
weight: 40
sections:
  - "free_works"
text: |-
  Denne skulpturserie, som består af fire svævende dobbeltskulpturer og én enkelt, søges udfoldet i en kombination af materialets lethed og en lysskabt rumudvidelse med henblik på visuelt at ophæve tyngdekraften.\
  Disse lysskulpturer, kaldet LysStof, befinder sig i spændingsfeltet mellem ultimativ frihed - alle menneskers drøm: at være frit svævende - og denne tilstands iboende, latente drama.\
  Dette udspilles i rummet mellem mand og kvinde, som frembyder en tilsvarende stræben efter det næsten uopnåelige øjeblik af både den ultimative tilstedeværelse i nuet og selvfortabelse.\
  \
de:
  name: "LichtStof"
  text: |-
    Diese Skulpturserie, die von ein Einzel- und vier Dobbeltskulpturen besteht,\
    wird in einer Kombination der Leichtigkeit des Materials und mit einer Lichtgemachter Raumausweitung entfaltet versucht um den visuellen Schwehrkraft aufzuheben.\
    Diese Lichtskulpture,LichtStof genannt,befinden sich im Spannungsfelt zwischen\
    ultimativer Freiheit - Traum aller Mennschen: frei schwebend zu sein - und dem\
    latenten Drama dieses Zustandes. \
    Es findet im Raum zwischen Frau und Mann statt, und zeigt einer ähnliche Streben vor nach dem unerreichbaren Augenblick von sowohl des ultimativen Awesenheit im Nun als auch Selbstverlierung.\
en:
  name: "Light Matter"
  text: |-
    This series of sculptures, consisting of four floating double sculptures and one single one is intended to unfold in a combinatination of the lightness of the material and the spatial expansion of the room created by light.\
    These light sculptures, named Light Matter, exist in the field of tension between ultimate freedom - the dream of all humans: to be free floating - and the inherent latent drama of this state of being.\
    This is acted out in the space between man and woman, which offers a similar striving after the nearly unattainable moment of both ultimate presence and loss of self.\
